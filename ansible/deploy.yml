---
- name: Deploy demo app to EKS
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    kubeconfig_path: "{{ lookup('env', 'HOME') }}/.kube/config"
    manifests_dir: "{{ playbook_dir }}/../k8s"
  tasks:
    - name: Require image_tag
      ansible.builtin.assert:
        that:
          - image_tag is defined
          - ecr_repository_url is defined
        fail_msg: "Pass -e image_tag=... -e ecr_repository_url=..."

    - name: Ensure kubeconfig exists
      ansible.builtin.stat:
        path: "{{ kubeconfig_path }}"
      register: kubeconfig

    - name: Refresh kubeconfig for EKS
      ansible.builtin.command: >
        aws eks update-kubeconfig
        --name {{ lookup('env', 'EKS_CLUSTER_NAME') | default('jenkins-k8s-eks', true) }}
        --kubeconfig {{ kubeconfig_path }}
      changed_when: true

    - name: Fail if kubeconfig is missing
      ansible.builtin.fail:
        msg: "Kubeconfig not found at {{ kubeconfig_path }}. Run aws eks update-kubeconfig first."
      when: not kubeconfig.stat.exists

    - name: Render deployment manifest with image tag
      ansible.builtin.copy:
        dest: /tmp/demo-app-deployment.yaml
        content: |
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: demo-app
            namespace: demo
            labels:
              app: demo-app
          spec:
            replicas: 2
            selector:
              matchLabels:
                app: demo-app
            template:
              metadata:
                labels:
                  app: demo-app
              spec:
                containers:
                  - name: demo-app
                    image: {{ ecr_repository_url }}:{{ image_tag }}
                    imagePullPolicy: Always
                    ports:
                      - containerPort: 8080
                    readinessProbe:
                      httpGet:
                        path: /health
                        port: 8080
                      initialDelaySeconds: 10
                      periodSeconds: 5
                    livenessProbe:
                      httpGet:
                        path: /health
                        port: 8080
                      initialDelaySeconds: 20
                      periodSeconds: 10
                    resources:
                      requests:
                        cpu: 100m
                        memory: 256Mi
                      limits:
                        cpu: 500m
                        memory: 512Mi

    - name: Apply namespace
      ansible.builtin.command: kubectl apply -f {{ manifests_dir }}/namespace.yaml
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    - name: Apply service
      ansible.builtin.command: kubectl apply -f {{ manifests_dir }}/service.yaml
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    - name: Apply deployment
      ansible.builtin.command: kubectl apply -f /tmp/demo-app-deployment.yaml
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    - name: Wait for rollout
      ansible.builtin.command: kubectl -n demo rollout status deployment/demo-app --timeout=180s
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
