apiVersion: v1
kind: Service
metadata:
  name: demo-app
  namespace: demo
  labels:
    app: demo-app
  annotations:
    # Internet-facing NLB in public subnets (tagged kubernetes.io/role/elb=1)
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
spec:
  type: LoadBalancer
  selector:
    app: demo-app
  ports:
    - name: http
      port: 80
      targetPort: 8080
